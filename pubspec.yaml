name: cv_flutter_chris
description: Application mobile présentant mon CV, ma famille et mes coordonnées.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - web/icons/AKON.JPG
    - web/family/pere.JPG
    - web/family/mere.JPG
    - web/family/frere.JPG
    - web/family/soeur.JPG
